<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Extension Panel 2</title>
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script src="/twitch-ext.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Twitch Panel standard custom scrollbars */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #18181B; }
    ::-webkit-scrollbar-thumb { background: #3F3F46; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #6366F1; }
    html, body {
      box-sizing: border-box;
    }
  </style>
</head>
<body id="panel-body" class="bg-[#18181B] text-[#EFEFF1] font-sans p-3 flex flex-col justify-between text-xs select-none overflow-y-auto">
  
  <div class="space-y-3">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-[#2D2D30] pb-2">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded bg-indigo-600 flex items-center justify-center font-bold text-white text-xs">
          P2
        </div>
        <div>
          <h1 class="font-semibold text-[#EFEFF1] text-sm">Rewards & Bits</h1>
          <p class="text-[10px] text-[#ADADB8]">Twitch Component / Panel 2</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5 bg-[#0E0E10] px-2 py-1 rounded border border-[#2D2D30]">
        <span id="ebs-status-dot" class="w-2 h-2 rounded-full bg-green-500"></span>
        <span id="ebs-status-text" class="text-[10px] font-mono text-indigo-400">Checking...</span>
      </div>
    </div>

    <!-- Twitch Bits Simulator Card (Demonstrates EBS transaction flow) -->
    <div class="bg-[#0E0E10] border border-[#2D2D30] rounded-lg p-2.5 space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-[11px] font-semibold text-[#EFEFF1] flex items-center gap-1">
          <span class="text-amber-400">💎</span> Twitch Bits Rewards
        </span>
        <span class="text-[9px] font-mono bg-[#1F1F23] text-indigo-400 px-1.5 py-0.5 rounded border border-[#2D2D30]">
          EBS Sync
        </span>
      </div>
      <p class="text-[11px] text-[#ADADB8]">
        Clicking a reward sends a request to the EBS backend, triggering live overlay fireworks!
      </p>

      <div class="space-y-1.5 pt-1">
        <button id="btn-bits-fireworks" class="w-full bg-[#18181B] hover:bg-[#1F1F23] border border-[#2D2D30] hover:border-amber-500/50 p-2 rounded flex items-center justify-between transition group">
          <div class="flex items-center gap-2 text-left">
            <span class="text-base group-hover:scale-110 transition">🎆</span>
            <div>
              <div class="font-semibold text-[#EFEFF1] text-xs">Stream Fireworks</div>
              <div class="text-[10px] text-[#ADADB8]">Trigger explosive visual FX on overlay</div>
            </div>
          </div>
          <span class="font-bold text-amber-400 bg-amber-950/60 px-2 py-1 rounded border border-amber-800/60 text-[10px] whitespace-nowrap">
            100 Bits
          </span>
        </button>

        <button id="btn-bits-boost" class="w-full bg-[#18181B] hover:bg-[#1F1F23] border border-[#2D2D30] hover:border-indigo-500/50 p-2 rounded flex items-center justify-between transition group">
          <div class="flex items-center gap-2 text-left">
            <span class="text-base group-hover:scale-110 transition">⚡</span>
            <div>
              <div class="font-semibold text-[#EFEFF1] text-xs">Poll Super Booster</div>
              <div class="text-[10px] text-[#ADADB8]">Adds +5 votes to current top choice</div>
            </div>
          </div>
          <span class="font-bold text-indigo-400 bg-indigo-950/60 px-2 py-1 rounded border border-indigo-800/60 text-[10px] whitespace-nowrap">
            50 Bits
          </span>
        </button>
      </div>
    </div>

    <!-- Community Leaderboard (Stored & updated in EBS state) -->
    <div class="bg-[#0E0E10] border border-[#2D2D30] rounded-lg p-2.5 space-y-2">
      <div class="flex items-center justify-between">
        <span class="font-semibold text-[#EFEFF1] text-xs flex items-center gap-1.5">
          <span class="text-amber-400">🏆</span> Top Supporters
        </span>
        <button id="btn-refresh-board" class="text-[10px] text-[#ADADB8] hover:text-[#EFEFF1] flex items-center gap-1">
          <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Refresh
        </button>
      </div>
      
      <div id="leaderboard-list" class="space-y-1">
        <!-- Rendered via JS -->
        <div class="text-neutral-500 text-center py-2">Loading leaderboard...</div>
      </div>
    </div>
  </div>

  <!-- Footer Event Log -->
  <div class="mt-3 pt-2 border-t border-neutral-800">
    <div class="flex items-center justify-between text-[10px] text-neutral-400 mb-1">
      <span class="font-mono">Panel 2 Activity Log</span>
      <button id="btn-clear-p2" class="text-neutral-500 hover:text-neutral-300">Clear</button>
    </div>
    <div id="p2-log-box" class="h-16 overflow-y-auto font-mono text-[10px] space-y-0.5 text-neutral-400 bg-neutral-950 p-1.5 rounded border border-neutral-800/80">
      <div>[ready] Panel 2 initialized</div>
    </div>
  </div>

  <script>
    const logBox = document.getElementById('p2-log-box');
    const ebsDot = document.getElementById('ebs-status-dot');
    const ebsStatusText = document.getElementById('ebs-status-text');
    const leaderboardList = document.getElementById('leaderboard-list');

    function log(msg, type = 'info') {
      const el = document.createElement('div');
      const time = new Date().toLocaleTimeString().split(' ')[0];
      el.className = type === 'error' ? 'text-rose-400' : type === 'success' ? 'text-emerald-400' : type === 'event' ? 'text-indigo-300' : 'text-neutral-400';
      el.textContent = `[${time}] ${msg}`;
      logBox.appendChild(el);
      logBox.scrollTop = logBox.scrollHeight;
    }

    document.getElementById('btn-clear-p2').addEventListener('click', () => {
      logBox.innerHTML = '<div>[ready] Log cleared</div>';
    });

    function resolveEbsUrl(endpoint = '/ping') {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const customEbs = urlParams.get('ebs') || urlParams.get('ebsUrl') || urlParams.get('backend');
        let base = customEbs ? customEbs.replace(/\/$/, '') : '';
        if (!base && urlParams.get('ebsPort')) {
          base = `${window.location.protocol}//${window.location.hostname}:${urlParams.get('ebsPort')}/api/ebs`;
        }
        if (!base && typeof window.TWITCH_EBS_URL === 'string') {
          base = window.TWITCH_EBS_URL.replace(/\/$/, '');
        }
        if (!base && typeof localStorage !== 'undefined' && localStorage.getItem('TWITCH_EBS_URL')) {
          base = localStorage.getItem('TWITCH_EBS_URL').replace(/\/$/, '');
        }
        if (!base) {
          base = '/api/ebs';
        }
        const cleanEndpoint = endpoint.startsWith('/api/ebs') ? endpoint.replace('/api/ebs', '') : endpoint;
        const subPath = cleanEndpoint.startsWith('/') ? cleanEndpoint : `/${cleanEndpoint}`;
        return new URL(`${base}${subPath}`, window.location.href).href;
      } catch (e) {
        return `/api/ebs${endpoint.startsWith('/') ? '' : '/'}${endpoint}`;
      }
    }

    const getEbs = () => ({
      ping: async () => {
        const targetUrl = resolveEbsUrl('/ping');
        const start = performance.now();
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 6000);
        try {
          const res = await fetch(targetUrl, {
            headers: { 'Accept': 'application/json' },
            signal: controller.signal,
          });
          clearTimeout(timeoutId);
          const latency = Math.round(performance.now() - start);
          if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
          const data = await res.json();
          return { ...data, latencyMs: latency, targetUrl };
        } catch (err) {
          clearTimeout(timeoutId);
          err.targetUrl = targetUrl;
          throw err;
        }
      },
      getState: async () => {
        const targetUrl = resolveEbsUrl('/state');
        const res = await fetch(targetUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status} from ${targetUrl}`);
        return await res.json();
      },
      sendAction: async (action, payload) => {
        const targetUrl = resolveEbsUrl('/action');
        const res = await fetch(targetUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, payload, sender: '/panel2.html' }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status} from ${targetUrl}`);
        return await res.json();
      },
      fetchConfig: async () => {
        const targetUrl = resolveEbsUrl('/config');
        const res = await fetch(targetUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status} from ${targetUrl}`);
        return await res.json();
      },
    });

    async function checkEbs() {
      const pingUrl = resolveEbsUrl('/ping');
      let targetObj;
      try {
        targetObj = new URL(pingUrl, window.location.href);
      } catch (e) {
        targetObj = {
          href: pingUrl,
          hostname: window.location.hostname || 'localhost',
          port: window.location.port || (window.location.protocol === 'https:' ? '443' : '80'),
          protocol: window.location.protocol || 'http:',
        };
      }
      const port = targetObj.port || (targetObj.protocol === 'https:' ? '443' : '80');

      log(`[PING] Connecting to EBS at: ${targetObj.href} (Port: ${port})...`, 'info');
      ebsDot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
      ebsStatusText.textContent = 'Checking...';

      try {
        const ebs = getEbs();
        const res = await ebs.ping();
        ebsDot.className = 'w-2 h-2 rounded-full bg-emerald-400';
        ebsStatusText.textContent = `${res.latencyMs}ms`;
        log(`✓ EBS Ping OK (${res.latencyMs}ms) | URL: ${targetObj.href} | Port: ${port}`, 'success');
      } catch (err) {
        ebsDot.className = 'w-2 h-2 rounded-full bg-rose-500';
        ebsStatusText.textContent = 'Offline';

        const errMsg = err.name === 'AbortError' ? 'Request timed out after 6s' : err.message;
        log(`❌ EBS Error: ${err.name} - ${errMsg}`, 'error');
        log(`   Target URL: ${targetObj.href}`, 'error');
        log(`   Target Host: ${targetObj.hostname} | Target Port: ${port} | Protocol: ${targetObj.protocol}`, 'error');
        log(`   Page Origin: ${window.location.origin} | Page Path: ${window.location.pathname}`, 'error');

        if (err.name === 'TypeError' || errMsg.toLowerCase().includes('failed to fetch') || errMsg.toLowerCase().includes('networkerror')) {
          log(`💡 Diagnostic Tip: If EBS is on https://${targetObj.hostname}:${port} with self-signed SSL, open "${targetObj.href}" in a new browser tab to accept the certificate, or start server with USE_SSL=false.`, 'event');
        }
      }
    }

    // Apply panel height based on query parameter (?height=300) or EBS config (100 - 500px)
    function applyHeight(h) {
      if (!h) return;
      const num = parseInt(h, 10);
      if (isNaN(num)) return;
      const clamped = Math.max(100, Math.min(500, num));
      const body = document.getElementById('panel-body') || document.body;
      body.style.minHeight = clamped + 'px';
      body.style.maxHeight = clamped + 'px';
      body.style.height = clamped + 'px';
      document.documentElement.style.height = clamped + 'px';
      log(`Panel 2 height adjusted to ${clamped}px`, 'info');
    }

    // Check query params immediately
    const urlParams = new URLSearchParams(window.location.search);
    const queryHeight = urlParams.get('height') || urlParams.get('h') || urlParams.get('panel2Height');
    if (queryHeight) {
      applyHeight(queryHeight);
    }

    async function loadLeaderboard() {
      try {
        const ebs = getEbs();
        if (!queryHeight) {
          try {
            const configRes = await ebs.fetchConfig();
            if (configRes && (configRes.panel2Height || configRes.panelHeight)) {
              applyHeight(configRes.panel2Height || configRes.panelHeight);
            }
          } catch(err){}
        }

        const state = await ebs.getState();
        if (state && state.leaderboard) {
          renderLeaderboard(state.leaderboard);
        }
      } catch (e) {
        console.warn(e);
      }
    }

    function renderLeaderboard(board) {
      if (!board || board.length === 0) {
        leaderboardList.innerHTML = '<div class="text-neutral-500 text-center py-2">No supporters yet</div>';
        return;
      }
      leaderboardList.innerHTML = board.map((item, idx) => {
        const rankColor = idx === 0 ? 'text-amber-400 font-bold' : idx === 1 ? 'text-neutral-300 font-bold' : idx === 2 ? 'text-amber-600 font-bold' : 'text-neutral-500';
        return `
          <div class="flex items-center justify-between p-1.5 rounded bg-neutral-900/90 text-xs border border-neutral-800/60">
            <div class="flex items-center gap-2">
              <span class="w-4 font-mono text-[10px] ${rankColor}">#${idx + 1}</span>
              <span class="font-medium text-neutral-200">${item.username}</span>
            </div>
            <span class="font-mono text-[11px] text-amber-400 font-semibold">${item.score} pts</span>
          </div>
        `;
      }).join('');
    }

    document.getElementById('btn-refresh-board').addEventListener('click', loadLeaderboard);

    // Bits fireworks click
    document.getElementById('btn-bits-fireworks').addEventListener('click', async () => {
      log('Simulating 100 Bits cheer via EBS...', 'event');
      try {
        const ebs = getEbs();
        const res = await ebs.sendAction('BITS_CHEER', {
          sku: 'bits_hype_100',
          amount: 100,
          user: 'PixelChampion'
        });
        log('Bits cheer processed! Fireworks sent to Overlay view.', 'success');
        if (res && res.leaderboard) renderLeaderboard(res.leaderboard);
      } catch (e) {
        log(`Bits error: ${e.message}`, 'error');
      }
    });

    // Poll super boost click
    document.getElementById('btn-bits-boost').addEventListener('click', async () => {
      log('Sending Poll Booster to EBS...', 'event');
      try {
        const ebs = getEbs();
        await ebs.sendAction('POLL_BOOST', { boostVotes: 5 });
        log('Boost applied! Panels and Overlay updated.', 'success');
      } catch (e) {
        log(`Boost error: ${e.message}`, 'error');
      }
    });

    // Run connection checks immediately
    checkEbs();
    loadLeaderboard();

    if (window.Twitch && window.Twitch.ext) {
      window.Twitch.ext.onAuthorized(() => {
        checkEbs();
        loadLeaderboard();
      });

      window.Twitch.ext.listen?.('broadcast', (target, contentType, message) => {
        try {
          const data = typeof message === 'string' ? JSON.parse(message) : message;
          if (data.type === 'LEADERBOARD_UPDATE' && data.leaderboard) {
            renderLeaderboard(data.leaderboard);
            log('Leaderboard updated via PubSub', 'event');
          }
        } catch(e){}
      });
    }

    setInterval(loadLeaderboard, 8000);
  </script>
</body>
</html>
